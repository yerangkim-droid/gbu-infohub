<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[파일럿] GC 글로벌사업본부 인포허브</title>
<style>
  @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css");
  :root{
    /* 브라우저 기본색(버튼 글자·스크롤바 등)도 OS 테마를 따르게 — 없으면 색 미지정 요소에 검정 폴백 */
    color-scheme:light dark;
    /* ── 중립 베이스 (4개 대시보드 공통) · 그레이는 GC Blue 쪽으로 아주 살짝 기울임 ── */
    --paper:#f5f7f9; --card:#ffffff;
    --ink:#111c26; --ink-2:#4f5c6a; --ink-3:#8a96a2;
    --line:#e5eaee; --line-strong:#d5dce2;
    /* ── GC CI (gcbiopharmadesign.com) ── */
    --gc-red:#e4002b; --gc-green:#007a33; --gc-blue:#0072ce;
    /* 대시보드 accent — CI 3색에서 파생한 4톤 (원색 2 + 심화 2) */
    --a-fx:#0072ce;        /* GC Blue 원색 */
    --a-market:#00426b;    /* GC Blue 심화 */
    --a-events:#007a33;    /* GC Green 원색 */
    --a-academic:#a8102c;  /* GC Red 심화 — 원색은 경고로 읽혀 톤다운 */
    /* 파일럿 배지 — CI 4색(파랑·네이비·초록·빨강) 어디와도 겹치지 않는 앰버.
       탭 칩으로 오인되지 않게 색과 형태를 일부러 다르게 뒀다(테두리 있음, 더 작음). */
    --pilot-ink:#8a5a12; --pilot-tint:#f8efdd; --pilot-line:#e7d5b2;
    --shadow-sm:0 1px 2px rgba(17,28,38,.04),0 1px 8px rgba(17,28,38,.04);
    --fs:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",Roboto,system-ui,sans-serif;
  }
  /* OS 다크 모드 추종 (대시보드와 동일 동작). data-theme="light" 명시 시 미적용 */
  @media (prefers-color-scheme:dark){
    html:not([data-theme="light"]){
      --paper:#0e1317; --card:#161c22;
      --ink:#e7edf2; --ink-2:#a6b2bd; --ink-3:#74808b;
      --line:#232b33; --line-strong:#313a43;
      --gc-red:#f0798c; --gc-green:#5ec98d; --gc-blue:#66b2ec;
      /* 다크 --a-market: 원래 #7ab6e8 였으나 --a-fx 와 거의 같아, 4색 칩이 동시에 보이는
         메뉴바에서 구분되도록 한 단계 더 짙은 파랑으로 조정(라이트의 '네이비=심화' 역할 유지) */
      --a-fx:#66b2ec; --a-market:#4a90c8; --a-events:#5ec98d; --a-academic:#f0798c;
      --pilot-ink:#e2bb7c; --pilot-tint:#332a1b; --pilot-line:#4c3e27;
      --shadow-sm:0 1px 2px rgba(0,0,0,.3),0 1px 8px rgba(0,0,0,.26);
    }
  }
  html[data-theme="dark"]{
    color-scheme:dark;
    --paper:#0e1317; --card:#161c22;
    --ink:#e7edf2; --ink-2:#a6b2bd; --ink-3:#74808b;
    --line:#232b33; --line-strong:#313a43;
    --gc-red:#f0798c; --gc-green:#5ec98d; --gc-blue:#66b2ec;
    --a-fx:#66b2ec; --a-market:#4a90c8; --a-events:#5ec98d; --a-academic:#f0798c;   /* market: 위 주석 참고 */
    --pilot-ink:#e2bb7c; --pilot-tint:#332a1b; --pilot-line:#4c3e27;
    --shadow-sm:0 1px 2px rgba(0,0,0,.3),0 1px 8px rgba(0,0,0,.26);
  }

  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--paper); color:var(--ink); font-family:var(--fs);
    -webkit-font-smoothing:antialiased; display:flex; flex-direction:column; min-height:100vh;
  }

  /* ── 상단 고정 헤더 ── */
  .topstack{
    position:sticky; top:0; z-index:50;
    background:var(--card); border-bottom:1px solid var(--line); box-shadow:var(--shadow-sm);
  }
  /* GC Gradation(Red→Green) — 브랜드를 표시하는 유일한 장식 요소 */
  .ciline{ height:3px; background:linear-gradient(90deg,var(--gc-red) 0%,#8f4a2c 46%,var(--gc-green) 100%); }

  /* 브랜드와 메뉴를 한 줄로 합쳐 상단 크롬을 줄이고 본문 영역을 넓힘 */
  .bar-inner{
    max-width:1200px; margin:0 auto; padding:0 22px;
    display:flex; align-items:center; column-gap:14px; row-gap:0; flex-wrap:wrap;
  }
  .brand{ display:flex; align-items:center; gap:13px; padding:13px 0; flex:none; }
  /* 다크 모드에서는 'GC녹십자' 워드마크(남색)가 어두운 헤더에 묻히므로 흰 판 위에 올린다.
     CI 적·녹 심볼 색을 그대로 살리려고 filter 로 반전시키지 않았다(아래 다크 블록 참고). */
  .brandlogo{ height:26px; width:auto; display:block; }
  .brand-divider{ width:1px; height:18px; background:var(--line-strong); }
  .btitle{ margin:0; font-weight:600; font-size:.97rem; letter-spacing:-.018em; color:var(--ink); white-space:nowrap; }
  /* 제목과 파일럿 배지를 한 덩어리로 — .brand 의 13px gap 이 둘 사이에 끼지 않게 한다 */
  .titlewrap{ display:flex; align-items:center; gap:8px; }
  .pilot{
    flex:none; padding:2px 8px; border-radius:999px;
    background:var(--pilot-tint); color:var(--pilot-ink); border:1px solid var(--pilot-line);
    font-size:.7rem; font-weight:700; line-height:1.5; white-space:nowrap; cursor:default;
  }

  /* ── 메뉴 (대시보드별 CI 컬러 칩 — 4색 상시 노출) ── */
  .tabs{
    margin-left:auto; display:flex; align-items:center; gap:7px; padding:7px 0;
    overflow-x:auto; scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{ display:none; }
  .navitem{
    appearance:none; border:none; font-family:inherit; cursor:pointer;
    padding:8px 14px; border-radius:999px;
    background:var(--tab-tint); color:var(--tab-ink);
    font-size:.875rem; font-weight:600; line-height:1.35;
    white-space:nowrap; letter-spacing:-.012em;
    transition:background-color .15s, color .15s;
  }
  .navitem:hover{ background:var(--tab-tint-hover); }
  .navitem:focus-visible{ outline:2px solid var(--tab); outline-offset:2px; }
  /* 활성 탭 — 해당 대시보드 CI 컬러로 꽉 채움 */
  .navitem.active{ background:var(--tab); color:var(--tab-on); font-weight:700; }
  .navitem.active:hover{ background:var(--tab); }

  /* 대시보드별 CI 컬러 — 비활성은 틴트 배경 + CI색 글씨, 활성은 채움 + 흰 글씨 */
  .navitem[data-route="fx"]{
    --tab:var(--a-fx);       --tab-ink:#005ea8; --tab-tint:#e8f2fb; --tab-tint-hover:#d6e8f7; --tab-on:#ffffff;
  }
  .navitem[data-route="competitor"]{
    --tab:var(--a-market);   --tab-ink:#00426b; --tab-tint:#e4ecf2; --tab-tint-hover:#d3e0ea; --tab-on:#ffffff;
  }
  .navitem[data-route="events"]{
    --tab:var(--a-events);   --tab-ink:#006129; --tab-tint:#e5f2ea; --tab-tint-hover:#d2e8db; --tab-on:#ffffff;
  }
  .navitem[data-route="academic"]{
    --tab:var(--a-academic); --tab-ink:#96122a; --tab-tint:#f8e8eb; --tab-tint-hover:#f2d7dc; --tab-on:#ffffff;
  }
  /* 다크 모드 칩 — 틴트는 어둡게, 글씨는 밝은 CI색 / 활성은 밝은 채움 + 어두운 글씨 */
  @media (prefers-color-scheme:dark){
    html:not([data-theme="light"]) .navitem[data-route="fx"]{
      --tab-ink:#8ec7f2; --tab-tint:#1b2b39; --tab-tint-hover:#233648; --tab-on:#0e1317;
    }
    html:not([data-theme="light"]) .navitem[data-route="competitor"]{
      --tab-ink:#7fb4dc; --tab-tint:#1a2733; --tab-tint-hover:#213141; --tab-on:#0e1317;
    }
    html:not([data-theme="light"]) .navitem[data-route="events"]{
      --tab-ink:#84d7a8; --tab-tint:#162b21; --tab-tint-hover:#1d382b; --tab-on:#0e1317;
    }
    html:not([data-theme="light"]) .navitem[data-route="academic"]{
      --tab-ink:#f59fad; --tab-tint:#331d24; --tab-tint-hover:#402530; --tab-on:#0e1317;
    }
    html:not([data-theme="light"]) .brandlogo{
      background:#ffffff; padding:5px 9px; border-radius:7px; box-sizing:content-box;
    }
  }
  html[data-theme="dark"] .brandlogo{
    background:#ffffff; padding:5px 9px; border-radius:7px; box-sizing:content-box;
  }
  html[data-theme="dark"] .navitem[data-route="fx"]{
    --tab-ink:#8ec7f2; --tab-tint:#1b2b39; --tab-tint-hover:#233648; --tab-on:#0e1317;
  }
  html[data-theme="dark"] .navitem[data-route="competitor"]{
    --tab-ink:#7fb4dc; --tab-tint:#1a2733; --tab-tint-hover:#213141; --tab-on:#0e1317;
  }
  html[data-theme="dark"] .navitem[data-route="events"]{
    --tab-ink:#84d7a8; --tab-tint:#162b21; --tab-tint-hover:#1d382b; --tab-on:#0e1317;
  }
  html[data-theme="dark"] .navitem[data-route="academic"]{
    --tab-ink:#f59fad; --tab-tint:#331d24; --tab-tint-hover:#402530; --tab-on:#0e1317;
  }

  @media (prefers-reduced-motion:reduce){
    .navitem{ transition:none; }
  }

  /* ── 콘텐츠 ── */
  .stage{ flex:1; position:relative; display:flex; }
  .frameWrap{ flex:1; position:relative; }
  .frameWrap iframe{ position:absolute; inset:0; width:100%; height:100%; border:none; background:var(--paper); }

  /* 좁은 화면: 브랜드 줄과 메뉴 줄을 분리 */
  @media (max-width:840px){
    .bar-inner{ padding:0 14px; }
    .brand{ padding:11px 0 9px; gap:10px; }
    .brandlogo{ height:23px; }
    .btitle{ font-size:.9rem; }
    .titlewrap{ gap:6px; }
    .pilot{ font-size:.66rem; padding:2px 7px; }
    .tabs{ margin-left:0; width:100%; border-top:1px solid var(--line); padding:8px 0; gap:6px; }
    .navitem{ padding:7px 12px; font-size:.84rem; }
  }
</style>
</head>
<body>

  <!-- 상단 고정 헤더 (브랜드 + 메뉴) -->
  <div class="topstack">
    <div class="ciline"></div>
    <header class="bar">
      <div class="bar-inner">
        <div class="brand">
          <img class="brandlogo" src="GC녹십자_logo.png" alt="GC녹십자">
          <span class="brand-divider"></span>
          <div class="titlewrap">
            <h1 class="btitle">글로벌 사업본부 인포 허브</h1>
            <span class="pilot" title="시범 운영 중입니다 — 수집 범위·화면 구성·데이터가 계속 바뀔 수 있습니다.">파일럿 버전</span>
          </div>
        </div>
        <nav class="tabs" id="nav" aria-label="대시보드">
          <button class="navitem" data-route="fx">실시간 환율</button>
          <button class="navitem" data-route="competitor">시장 모니터링</button>
          <button class="navitem" data-route="academic">학술/임상 모니터링</button>
          <button class="navitem" data-route="events">학회 일정</button>
        </nav>
      </div>
    </header>
  </div>

  <!-- 콘텐츠 (iframe) -->
  <div class="stage">
    <div class="frameWrap" id="frameWrap"></div>
  </div>

<script>
"use strict";
/* ═══════════════ 라우팅 ═══════════════ */
const ROUTES = {
  fx:        { file:"환율.html" },
  competitor:{ file:"경쟁동향_대시보드.html" },
  academic:  { file:"글로벌학술동향_대시보드.html" },
  events:    { file:"글로벌학회일정_대시보드.html" },
};
const DEFAULT_ROUTE = "fx";
const frames = {};
const frameWrap = document.getElementById("frameWrap");

function currentRoute(){
  const h = (location.hash || "").replace("#","");
  return ROUTES[h] ? h : DEFAULT_ROUTE;
}
function ensureFrame(route){
  if(frames[route]) return frames[route];
  const f = document.createElement("iframe");
  f.title = route;
  f.src = ROUTES[route].file;
  frameWrap.appendChild(f);
  frames[route] = f;
  return f;
}
function showRoute(route){
  document.querySelectorAll(".navitem").forEach(b=>{
    const on = b.dataset.route===route;
    b.classList.toggle("active", on);
    b.setAttribute("aria-current", on ? "page" : "false");
  });
  const target = ensureFrame(route);
  Object.values(frames).forEach(f=> f.style.display = (f===target ? "block" : "none"));
}
function navTo(route){ location.hash = "#"+route; }
document.getElementById("nav").addEventListener("click", e=>{
  const b = e.target.closest(".navitem"); if(!b) return;
  navTo(b.dataset.route);
});
window.addEventListener("hashchange", ()=> showRoute(currentRoute()));

/* ═══════════════ 초기화 ═══════════════ */
(function init(){
  if(!location.hash) location.replace("#"+DEFAULT_ROUTE);
  showRoute(currentRoute());
})();
</script>
</body>
</html>
