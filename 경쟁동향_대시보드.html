// 수집 창(최근 2년) 이전 자료는 "이전 자료"로 묶음 — 접속 시점 기준 동적 계산
const _now=new Date(), _ny=_now.getFullYear(), _nm=_now.getMonth()+1;
const WEEK_CUTOFF=(_ny-2)*10000+_nm*100;
const QTR_CUTOFF=(_ny-2)*10+(Math.floor((_nm-1)/3)+1);
function weekInfo(dateStr){
  const earlier={key:"earlier",label:"이전 자료",sort:-1};
  if(!dateStr) return earlier;
  const p=String(dateStr).split("-"); const y=+p[0]; const m=p[1]?+p[1]:0; const day=p[2]?+p[2]:0;
  const wk=day?Math.min(5,Math.floor((day-1)/7)+1):0;
  const sort=y*10000+m*100+wk;
  if(sort<WEEK_CUTOFF) return earlier;
  if(!m) return {key:y+"-00",label:y+"년 (월미상)",sort:y*10000};
  if(!day) return {key:y+"-"+pad(m)+"-W0",label:y+"년 "+m+"월 (일자미상)",sort:y*10000+m*100};
  return {key:y+"-"+pad(m)+"-W"+wk,label:y+"년 "+m+"월 "+wk+"주",sort};
}
function quarterInfo(dateStr){
  const earlier={key:"earlier",label:"이전 자료",sort:-1};
  if(!dateStr) return earlier;
  const p=String(dateStr).split("-"); const y=+p[0]; const m=p[1]?+p[1]:0;
  if(!y) return earlier;
  if(!m) return {key:y+"-Q0",label:y+"년 (분기미상)",sort:y*10};
  const q=Math.floor((m-1)/3)+1; const sort=y*10+q;
  if(sort<QTR_CUTOFF) return earlier;
  return {key:y+"-Q"+q,label:y+"년 "+q+"분기",sort};
}
function periodInfo(d){return state.mode==="ir"?quarterInfo(d.date):weekInfo(d.date);}

function filtered(){
  return DATA.filter(d=>{
    if(d.source_type!==state.mode) return false;
    if(catHidden(state.mode, d.category)) return false;
    if(state.period && periodInfo(d).key!==state.period) return false;
    if(state.cats.size && !state.cats.has(d.category)) return false;
    if(state.q){const hay=(d.title+" "+d.summary_ko+" "+d.comp_product+" "+(d.linked_issue||"")+" "+d.competitor).toLowerCase();
      if(!hay.includes(state.q.toLowerCase())) return false;}
    return true;
  });
}

function renderPeriods(){
  const isIr=state.mode==="ir";
  const src=DATA.filter(d=>d.source_type===state.mode && !catHidden(state.mode,d.category));
  const info=isIr?quarterInfo:weekInfo;
  const map={};
  src.forEach(d=>{const w=info(d.date);(map[w.key]=map[w.key]||{label:w.label,sort:w.sort,n:0}).n++;});
  const keys=Object.keys(map).sort((a,b)=>map[b].sort-map[a].sort);
  const lbl=document.getElementById("periodlbl");if(lbl)lbl.textContent=isIr?"분기별 (탭 선택)":"주차별 (탭 선택)";
  let h=`<button class="wtab" data-w="" aria-pressed="${state.period===""}"><span class="wt">전체</span><span class="wc">${src.length}건</span></button>`;
  keys.forEach(k=>{h+=`<button class="wtab" data-w="${esc(k)}" aria-pressed="${state.period===k}"><span class="wt">${esc(map[k].label)}</span><span class="wc">${map[k].n}건</span></button>`;});
  const el=document.getElementById("weektabs");el.innerHTML=h;
  el.querySelectorAll(".wtab").forEach(b=>b.onclick=()=>{state.period=b.dataset.w;render();});
}

function renderCats(){
  const src=DATA.filter(d=>d.source_type===state.mode && !catHidden(state.mode, d.category));
  const map={};src.forEach(d=>map[d.category]=(map[d.category]||0)+1);
  // 정의된 5개 사업 영역을 모두 노출(데이터 없어도 표시), 정의에 없는 값이 있으면 뒤에 추가
  // 단, 해당 유형의 비대상 영역(예: IR 탭의 기술이전/Plant, Bulk)은 아예 뺀다
  const cats=[...new Set([...CAT_ORDER,...Object.keys(map)])]
    .filter(c=>!catHidden(state.mode, c))
    .sort((a,b)=>catRank(a)-catRank(b)||a.localeCompare(b));
  const el=document.getElementById("catfilter");
  let h=`<button class="pill pill-all" data-c="" aria-pressed="${state.cats.size===0}">전체 <span class="cnt">${src.length}</span></button>`;
  h+=cats.map(c=>{
    const n=map[c]||0;
    if(!n) return `<button class="pill pill-empty" disabled title="데이터 수집 예정"><span class="pdot" style="background:${catColor(c)}"></span>${esc(catLabel(c))} <span class="cnt">수집예정</span></button>`;
    return `<button class="pill" data-c="${esc(c)}" aria-pressed="${state.cats.has(c)}"><span class="pdot" style="background:${catColor(c)}"></span>${esc(catLabel(c))} <span class="cnt">${n}</span></button>`;
  }).join("");
  el.innerHTML=h;
  el.querySelectorAll(".pill:not([disabled])").forEach(b=>b.onclick=()=>{const c=b.dataset.c;if(!c){state.cats.clear();}else{state.cats.has(c)?state.cats.delete(c):state.cats.add(c);}render();});
}

function card(d){
  const s=SRC[d.source_type]||{label:d.source_type,color:"var(--ink-3)",bg:"var(--line-2)"};
  const nct=d.nct_id?`<a class="nct" href="https://clinicaltrials.gov/study/${esc(d.nct_id)}" target="_blank" rel="noopener">${esc(d.nct_id)}</a>`:"";
  const issue=d.linked_issue?`<div class="row1"><span class="issue" style="--icol:${catColor(d.category)}">${esc(d.linked_issue)}</span></div>`:"";
  // 카드 왼쪽 색상 바 = 사업 영역 색상 (필터 점·그룹 헤더·이슈 태그와 동일 색 체계)
  return `<article class="card" style="--bar:${catColor(d.category)}">
    <div class="row1">
      <span class="badge" style="color:${s.color};background:${s.bg}">${s.label}</span>
      <span class="badge" style="color:var(--ink-2);background:var(--line-2)">${esc(d.competitor)}</span>
      <span class="date">${esc(d.date||"")}</span>
    </div>
    <div class="title"><a href="${esc(d.url)}" target="_blank" rel="noopener">${esc(d.title)}</a></div>
    <div class="summary">${esc(d.summary_ko)}</div>
    ${issue}
    <div class="actions">
      <a class="readmore" href="${esc(d.url)}" target="_blank" rel="noopener">원문 보기 ↗</a>
      ${nct}<span class="srcname">출처: ${esc(hostOf(d.url))}</span>
    </div>
  </article>`;
}

function render(){
  renderModes();renderPeriods();renderCats();
  const list=filtered();
  list.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  const modeSrc=DATA.filter(d=>d.source_type===state.mode);
  let periodLabel=state.period;
  const pf=modeSrc.find(d=>periodInfo(d).key===state.period);
  if(pf)periodLabel=periodInfo(pf).label;
  const wkctx=state.period?` · <span class="wkctx">${esc(periodLabel)}</span>`:"";
  document.getElementById("count").innerHTML=`<b>${list.length}</b> / ${modeSrc.length}건 표시${wkctx}`;
  const res=document.getElementById("results");
  if(!list.length){
    res.innerHTML=`<div class="empty">조건에 맞는 항목이 없습니다. 필터를 조정해 보세요.</div>`;return;
  }
  // 카테고리(사업영역)별로만 묶고, 각 기사는 개별 카드로 전체 표시 (경쟁사 그룹핑 제거)
  const byCat={};list.forEach(d=>{(byCat[d.category]=byCat[d.category]||[]).push(d);});
  const cats=Object.keys(byCat).sort((a,b)=>catRank(a)-catRank(b)||a.localeCompare(b));
  let html="";
  for(const cat of cats){
    const items=byCat[cat];   // list가 이미 날짜 내림차순 정렬 → 카테고리 내 순서 유지
    html+=`<section class="panel catpanel" style="--cat:${catColor(cat)}"><div class="cathead"><span class="catdot"></span>${esc(catLabel(cat))} <span class="cc">${items.length}건</span></div><div class="cards">${items.map(card).join("")}</div></section>`;
  }
  res.innerHTML=html;
}

document.getElementById("q").addEventListener("input",e=>{state.q=e.target.value;render();});
document.getElementById("reset").addEventListener("click",()=>{
  state.q="";state.cats.clear();state.period="";
  document.getElementById("q").value="";render();
});
// 테마 전환 시 사업 영역 색상(인라인 지정)을 다시 계산해야 하므로 재렌더
document.getElementById("themeBtn")?.addEventListener("click",()=>{const r=document.documentElement;const cur=r.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");r.setAttribute("data-theme",cur==="dark"?"light":"dark");render();});

document.getElementById("covnote").innerHTML=
  `<div class="cvtitle">수집 범위 및 한계</div>`+
  `<ul>`+
  `<li>5개 사업 영역 시장 및 경쟁 동향 관련하여 키워드를 조합해 <b>최근 2년간</b>의 자료를 수집했습니다.</li>`+
  `<li><b>뉴스 기사</b>는 전세계 공개된 뉴스 중 관련 내용을 가져와서 <b>주차별</b>로 구성했습니다.</li>`+
  `<li><b>경쟁사 IR 자료</b>는 각 경쟁사 공식 채널로 공시한 IR 리포트를 <b>분기별</b>로 가져와 요약했습니다.</li>`+
  `<li>모든 요약은 출처에 명시된 사실만 반영하여 각 카드의 <b>‘원문 보기’</b>로 검증할 수 있습니다.</li>`+
  `</ul>`;

function normalizeData(){
  DATA.forEach(d=>{
    if(d.source_type==="issue") d.source_type="news";   // 시장 이슈는 별도 분리 없이 주차별 뉴스 기사에 포함
    d.category=catKey(d.category);                      // 구 8개 분류 → 통합 5개 사업 영역
    if(!gcCat[d.gc_product])gcCat[d.gc_product]=d.category;
    if(d.nct_id===undefined)d.nct_id=null;
  });
}
normalizeData();
render();
</script>
